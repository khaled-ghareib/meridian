/* ============================================================ sheets & dialogs */
const stack = [];
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheet").scrollTop = 0; $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); stack.push("sheet"); }
function closeSheet(){ $("#sheet").classList.remove("on"); if (!$("#dialog").classList.contains("on")) $("#scrim").classList.remove("on"); const i = stack.lastIndexOf("sheet"); if (i > -1) stack.splice(i,1); }
function openDialog(html){ $("#dialog").innerHTML = html; $("#dialog").classList.add("on"); $("#scrim").classList.add("on"); stack.push("dialog"); }
function closeDialog(){ $("#dialog").classList.remove("on"); if (!$("#sheet").classList.contains("on")) $("#scrim").classList.remove("on"); const i = stack.lastIndexOf("dialog"); if (i > -1) stack.splice(i,1); }
function confirmBox(title, text, okText, danger){
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="btnrow"><button class="btn ghost" id="dNo">Cancel</button><button class="btn ${danger ? "danger" : ""}" id="dYes">${esc(okText)}</button></div>`);
    $("#dNo").onclick = () => { closeDialog(); res(false); };
    $("#dYes").onclick = () => { closeDialog(); res(true); };
  });
}
let toastTimer;
function toast(text, btn, fn, ms){
  $("#toastText").textContent = text; $("#toastBtn").textContent = btn || ""; $("#toastBtn").onclick = () => { fn && fn(); $("#toast").classList.remove("on"); };
  $("#toast").classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), ms || 4000);
}
$("#scrim").onclick = () => { if ($("#dialog").classList.contains("on")) return; closeSheet(); };

/* ---- add / edit transaction */
function txSheet(existing, pendingItem){
  const pf = pendingItem || null;
  let type = existing ? existing.type : pf ? pf.type : "expense";
  let catId = existing ? existing.catId : pf ? pf.catId : null;
  const defDate = existing ? existing.date : pf ? pf.date : (month === currentKey() ? isoToday() : `${month}-01`);
  const draw = () => {
    const list = cats(type);
    if (catId && !list.find(c => c.id === catId) && !(existing && existing.catId === catId && existing.type === type)) catId = null;
    $("#catgrid").innerHTML = list.length ? list.map(c => `<button class="cat ${c.id === catId ? "on" : ""}" data-cat="${c.id}"><i class="dot" style="background:${cc(c.color)}"></i>${esc(c.name)}</button>`).join("")
      : `<div class="empty" style="padding:8px 0">No ${type} categories yet — add one in Settings.</div>`;
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.type === type));

  };
  const preAmt = existing ? existing.amount : pf ? pf.amount : "";
  const preNote = existing ? (existing.note || "") : pf ? pf.merchant : "";
  openSheet(`<h2>${existing ? "Edit transaction" : pf ? "Review bank text" : "New transaction"}</h2>
    ${pf ? `<div class="smsraw">${esc(pf.raw)}</div>` : ""}
    <div class="seg" id="seg"><button data-type="expense" class="exp">Expense</button><button data-type="income" class="inc">Income</button></div>
    <div class="amount-box"><span>EGP</span><input id="fAmt" class="num" inputmode="decimal" placeholder="0" autocomplete="off" value="${preAmt}"></div>

    <div class="field"><label class="label">Date</label><input type="date" class="input" id="fDate" value="${defDate}" min="2000-01-01" max="2100-12-31"></div>
    <div class="field"><label class="label">Note <span style="text-transform:none;letter-spacing:0;color:var(--faint)">· optional</span></label><input class="input" id="fNote" maxlength="80" placeholder="e.g. dinner with friends" value="${esc(preNote)}"></div>
    <div class="err" id="fErr"></div>
    <button class="btn" id="saveTx">${existing ? "Save changes" : pf ? "Add transaction" : "Add transaction"}</button>
    ${pf ? `<div class="btnrow"><button class="btn ghost" id="skipPend">Skip — not a transaction</button></div>` : ""}
    ${existing ? `<div class="btnrow"><button class="btn danger" id="delTx">Delete</button></div>` : ""}`);
  draw();
  if (!existing && !pf) setTimeout(() => $("#fAmt").focus(), 300);
  if (pf) $("#skipPend").onclick = () => { S.pending = S.pending.filter(x => x.id !== pf.id); save(); closeSheet(); render(); toast("Skipped"); };
  $("#seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; type = b.dataset.type; draw(); };
  $("#catgrid").onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; catId = b.dataset.cat; draw(); };
  $("#saveTx").onclick = () => {
    const a = parseNum($("#fAmt").value);
    const date = $("#fDate").value;
    if (!(a > 0)) return $("#fErr").textContent = "Enter an amount greater than 0.";
    if (a >= 1e9) return $("#fErr").textContent = "That amount looks too large.";
    if (!catId) return $("#fErr").textContent = "Pick a category.";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date < "2000-01-01" || date > "2100-12-31") return $("#fErr").textContent = "Pick a valid date.";
    const rec = {id: existing ? existing.id : uid(), type, amount: Math.round(a*100)/100, catId, date, note: $("#fNote").value.trim(), created: existing ? existing.created : Date.now()};
    const fromSms = pf || (existing && existing.source === "sms");
    if (fromSms) rec.source = "sms";
    if (existing) S.tx[S.tx.findIndex(t => t.id === existing.id)] = rec; else S.tx.push(rec);
    if (pf) { S.pending = S.pending.filter(x => x.id !== pf.id); learnRule(type, pf.merchant, catId); }
    else if (existing && existing.source === "sms" && existing.catId !== catId) learnRule(type, existing.note, catId);
    save(); closeSheet();
    month = date.slice(0,7);
    render();
    let msg = existing ? "Changes saved" : `${type === "income" ? "Income" : "Expense"} of ${amt(rec.amount)} added`;
    const gp = goalPlan();
    if (!existing && type === "income" && gp && gp.latest && gp.latest.tx.id === rec.id && !gp.done) {
      msg = gp.latest.setAside > 0 ? `Income added · put aside ${egp(gp.latest.setAside)} for ${gp.g.name}` : `Income added · this month’s goal target is already covered`;
      toast(msg, "PLAN", () => setTab("plan"), 6500); return;
    }
    toast(msg);
  };
  if (existing) $("#delTx").onclick = async () => {
    if (!await confirmBox("Delete this transaction?", `${amt(existing.amount)} · ${catOf(existing.type, existing.catId)?.name || "Uncategorised"}`, "Delete", true)) return;
    const idx = S.tx.findIndex(t => t.id === existing.id), removed = S.tx.splice(idx, 1)[0];
    save(); closeSheet(); render();
    toast("Transaction deleted", "UNDO", () => { S.tx.splice(idx, 0, removed); save(); render(); });
  };
}

/* ---- categories */
function catSheet(type, id){
  const list = cats(type), c = id ? list.find(x => x.id === id) : null;
  const palette = type === "income" ? INC_COLORS : EXP_COLORS;
  let color = c ? c.color : (palette.find(p => !list.some(x => x.color === p)) || palette[list.length % palette.length]);
  const used = c ? S.tx.filter(t => t.type === type && t.catId === c.id).length : 0;
  openSheet(`<h2>${c ? "Edit category" : `New ${type} category`}</h2>
    <div class="field"><label class="label">Name</label><input class="input" id="cName" maxlength="28" value="${c ? esc(c.name) : ""}" placeholder="e.g. Gym"></div>
    ${type === "expense" ? `<div class="field"><label class="label">Monthly budget (EGP) <span style="text-transform:none;letter-spacing:0;color:var(--faint)">· optional</span></label>
      <input class="input num" id="cBudget" inputmode="decimal" placeholder="No budget" value="${c && c.budget > 0 ? c.budget : ""}"></div>` : ""}
    <div class="field"><label class="label">Colour</label><div class="swatches" id="sw">${palette.map(p => `<button class="sw ${p === color ? "on" : ""}" data-c="${p}" style="background:${cc(p)}"></button>`).join("")}</div></div>
    <div class="err" id="cErr"></div>
    <button class="btn" id="cSave">${c ? "Save" : "Add category"}</button>
    ${c ? `<div class="btnrow"><button class="btn danger" id="cDel">Delete category</button></div>
      <p class="foot">${used ? `${used} transaction${used > 1 ? "s use" : " uses"} this category. Renaming updates them too.` : "No transactions use this category yet."}</p>` : ""}`);
  if (!c) setTimeout(() => $("#cName").focus(), 300);
  $("#sw").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; document.querySelectorAll("#sw .sw").forEach(s => s.classList.toggle("on", s.dataset.c === color)); };
  $("#cSave").onclick = () => {
    const name = $("#cName").value.trim();
    if (!name) return $("#cErr").textContent = "Give the category a name.";
    if (list.some(x => x.name.toLowerCase() === name.toLowerCase() && x !== c)) return $("#cErr").textContent = "You already have a category with that name.";
    let budget = null;
    if (type === "expense") {
      const raw = $("#cBudget").value.trim();
      if (raw) { budget = parseNum(raw); if (!(budget > 0)) return $("#cErr").textContent = "Budget must be a positive number, or leave it empty."; }
    }
    if (c) { c.name = name; c.color = color; if (type === "expense") c.budget = budget; delete c.auto; }
    else list.push({id: uid(), name, color, ...(type === "expense" ? {budget} : {})});
    save(); closeSheet(); render(); toast(c ? "Category updated" : `“${name}” added`);
  };
  if (c) $("#cDel").onclick = async () => {
    if (!await confirmBox(`Delete “${c.name}”?`, used ? `${used} transaction${used>1?"s":""} will show as Uncategorised. You can re-assign them by editing each one.` : "This can’t be undone.", "Delete", true)) return;
    list.splice(list.indexOf(c), 1); save(); closeSheet(); render(); toast("Category deleted");
  };
}

  const endDef = g ? g.end : endFor(12);
  openSheet(`<h2>${g ? "Edit savings goal" : "New savings goal"}</h2>
    <div class="field"><label class="label">What are you saving for?</label><input class="input" id="gName" maxlength="32" placeholder="e.g. New PC" value="${g ? esc(g.name) : ""}"></div>
    <div class="field"><label class="label">Goal amount</label><div class="amount-box" style="margin-bottom:0"><span>EGP</span><input id="gTarget" class="num" inputmode="decimal" placeholder="20,000" value="${g ? fmt(g.target) : ""}"></div></div>
    <div class="field"><label class="label">Reach it by</label>
      <div class="quick" id="gQuick">${[3,6,12,18,24].map(n => `<button data-m="${n}">${n < 12 ? n + " months" : n === 12 ? "1 year" : n === 24 ? "2 years" : "18 months"}</button>`).join("")}</div>
      <input type="date" class="input" id="gEnd" value="${endDef}"></div>

    <div class="err" id="gErr"></div>

    ${g ? `<div class="btnrow"><button class="btn danger" id="gDel">Delete goal</button></div>` : ""}`);

  $("#gTarget").onblur = () => { const v = parseNum($("#gTarget").value); if (v > 0) $("#gTarget").value = fmt(v); };

    const name = $("#gName").value.trim() || "My goal";

  };
  if (g) $("#gDel").onclick = async () => {
    if (!await confirmBox("Delete this goal?", "Your transactions stay — only the goal and its plan are removed.", "Delete", true)) return;
    S.goal = null; save(); closeSheet(); render(); toast("Goal deleted");
  };
}

/* ---- interest calculator */
function calcSheet(){
  const C = S.calc;
  const isLoan = () => C.mode === "loan";
  const cur = () => isLoan() ? C.loan : C.save;
  const v2 = n => (Math.round(n*100)/100);
  const show = (n, d=2) => Number.isFinite(n) ? fmt(v2(n), Number.isInteger(v2(n)) ? 0 : d) : "";
  const resultOf = () => { const c = cur(); return isLoan() ? Calc.loanPay(c.P, c.r, c.n, c.type) : Calc.saveFinal(c.P, c.r, c.n, c.type); };

  function draw(){
    const c = cur(), loan = isLoan();
    $("#calcBody").innerHTML = `
      <div class="seg small" id="typeSeg">${loan
        ? `<button data-t="flat" class="${c.type === "flat" ? "on" : ""}">Flat rate · shops, valU</button><button data-t="reducing" class="${c.type === "reducing" ? "on" : ""}">Reducing · bank loan</button>`
        : `<button data-t="simple" class="${c.type === "simple" ? "on" : ""}">Paid monthly · certificates</button><button data-t="compound" class="${c.type === "compound" ? "on" : ""}">Reinvested · compound</button>`}</div>
      <div class="calc-f"><label for="cP">${loan ? "Price / amount borrowed" : "Deposit"}</label><input id="cP" class="num" inputmode="decimal" data-k="P"><span class="unit">EGP</span></div>
      <div class="calc-f"><label for="cR">Interest rate</label><input id="cR" class="num" inputmode="decimal" data-k="r"><span class="unit">% / year</span></div>
      <div class="calc-f"><label for="cN">Time</label><input id="cN" class="num" inputmode="decimal" data-k="n"><span class="unit">months</span><span class="hint" id="cNh"></span></div>
      <div class="quick" id="nQuick">${[6,12,18,24,36,60].map(n => `<button data-n="${n}">${n < 12 ? n + " mo" : (n/12) + (n === 12 ? " year" : " years")}</button>`).join("")}</div>
      <div class="calc-f result"><label for="cA">${loan ? "Monthly installment" : "You’ll have at the end"}</label><input id="cA" class="num" inputmode="decimal" data-k="A"><span class="unit">EGP</span>
        <span class="hint">Type here to find the interest rate that gives this result.</span></div>
      <div class="err" id="cErr"></div>
      <div class="calc-sum" id="calcSum"></div>`;
    fill(null);
  }
  function fill(skip){
    const c = cur(), A = resultOf();
    const set = (id, val) => { if (id !== skip) $("#" + id).value = val; };
    set("cP", show(c.P)); set("cR", show(c.r, 2)); set("cN", show(c.n, 1)); set("cA", show(A));
    $("#cNh").textContent = c.n >= 12 ? `= ${fmt(c.n/12, c.n % 12 ? 1 : 0)} year${c.n === 12 ? "" : "s"}` : "";
    summary(A);
  }
  function summary(A){
    const c = cur(), loan = isLoan(), el = $("#calcSum");
    if (!Number.isFinite(A) || !(c.P > 0) || !(c.n > 0)) { el.innerHTML = ""; return; }
    if (loan) {
      const total = A * c.n, interest = total - c.P, share = total > 0 ? c.P / total : 1;
      el.innerHTML = `<div class="split"><div style="width:${share*100}%;background:var(--mint)"></div><div style="flex:1;background:var(--coral)"></div></div>
        <div class="l"><span><i class="dot" style="background:var(--mint)"></i> Price</span><b class="num">${egp(c.P, 0)}</b></div>
        <div class="l"><span><i class="dot" style="background:var(--coral)"></i> Interest you pay</span><b class="num">${egp(interest, 0)}</b></div>
        <div class="l"><span>Total you pay</span><b class="num">${egp(total, 0)}</b></div>
        <div class="l"><span>Extra cost vs paying cash</span><b class="num">${pct(interest / c.P, 1)}</b></div>
        <p class="calc-note">${c.type === "flat" ? "Flat rate: interest is charged on the full price for the whole period — how most shops and installment apps quote it. A flat rate costs more than the same reducing rate." : "Reducing balance: interest is charged only on what you still owe — how bank loans usually work."}</p>`;
    } else {
      const interest = A - c.P, share = A > 0 ? c.P / A : 1;
      el.innerHTML = `<div class="split"><div style="width:${share*100}%;background:var(--gold)"></div><div style="flex:1;background:var(--mint)"></div></div>
        <div class="l"><span><i class="dot" style="background:var(--gold)"></i> Your deposit</span><b class="num">${egp(c.P, 0)}</b></div>
        <div class="l"><span><i class="dot" style="background:var(--mint)"></i> Interest earned</span><b class="num">${egp(interest, 0)}</b></div>
        ${c.type === "simple" ? `<div class="l"><span>Monthly interest payout</span><b class="num">${egp(c.P * c.r / 1200, 0)}</b></div>` : `<div class="l"><span>Interest in the first month</span><b class="num">${egp(c.P * c.r / 1200, 0)}</b></div>`}
        <div class="l"><span>Total at the end</span><b class="num">${egp(A, 0)}</b></div>
        <p class="calc-note">${c.type === "simple" ? "Paid monthly: the bank pays the interest out each month and your deposit stays the same — how most Egyptian bank certificates work." : "Reinvested: each month’s interest is added to the balance and earns interest too."}</p>`;
    }
  }
  openSheet(`<h2>Interest calculator</h2>
    <div class="seg" id="modeSeg"><button data-m="loan" class="${C.mode === "loan" ? "on" : ""}">Loan / installments</button><button data-m="save" class="${C.mode === "save" ? "on" : ""}">Savings / certificate</button></div>
    <div id="calcBody"></div>`);
  draw();
  $("#modeSeg").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; C.mode = b.dataset.m;
    document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x === b)); draw(); saveSoon(); };
  $("#calcBody").addEventListener("click", e => {
    const t = e.target.closest("[data-t]"); if (t) { cur().type = t.dataset.t; draw(); saveSoon(); return; }
    const q = e.target.closest("[data-n]"); if (q) { cur().n = +q.dataset.n; $("#cErr").textContent = ""; fill(null); saveSoon(); }
  });
  $("#calcBody").addEventListener("input", e => {
    const inp = e.target.closest("input[data-k]"); if (!inp) return;
    const c = cur(), k = inp.dataset.k, v = parseNum(inp.value);
    $("#cErr").textContent = "";
    if (!(v >= 0) || (k !== "r" && !(v > 0))) { summary(NaN); return; }
    if (k === "A") {
      const r = isLoan() ? Calc.loanRate(c.P, c.n, v, c.type) : Calc.saveRate(c.P, c.n, v, c.type);
      if (r === -1) { $("#cErr").textContent = isLoan() ? "That installment repays less than the price — no interest rate gives that." : "That’s less than your deposit — no interest rate gives that."; summary(NaN); return; }
      if (!Number.isFinite(r)) { $("#cErr").textContent = "That needs an unrealistic interest rate."; summary(NaN); return; }
      c.r = Math.round(r*100)/100;
    } else c[k] = v;
    fill(inp.id); saveSoon();
  });
  $("#calcBody").addEventListener("focusout", e => { if (e.target.closest("input[data-k]")) fill(null); });
}

/* ---- export / import */
async function deliver(filename, mime, content){
  if (window.Android && Android.shareFile) { Android.shareFile(filename, mime, content); return; }
  try {
    const file = new File([content], filename, {type: mime});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: filename}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type: mime})); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportJson(){ deliver(`meridian-backup-${isoToday()}.json`, "application/json", JSON.stringify(S, null, 1)); }
function exportCsv(){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Date","Type","Amount (EGP)","Category","Notes"]].concat(
    [...S.tx].sort((a,b) => a.date.localeCompare(b.date)).map(t => [t.date, t.type === "income" ? "Income" : "Expense", t.amount, catOf(t.type, t.catId)?.name || "Uncategorised", t.note || ""]));
  deliver(`meridian-transactions-${isoToday()}.csv`, "text/csv", "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n"));
}
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    let s; try { s = JSON.parse(rd.result); } catch(err) { s = null; }
    e.target.value = "";
    if (!validState(s)) return toast("That file isn’t a Meridian backup");
    if (!await confirmBox("Restore this backup?", `It has ${s.tx.length} transactions and will replace the ${S.tx.length} on this phone.`, "Restore")) return;
    S = upgrade(s); save(); applyTheme(); render(); toast("Backup restored");
  };
  rd.readAsText(f);
};

  const pa = e.target.closest("[data-padd]"); if (pa) {

    S.tx.push({id: uid(), type: it.type, amount: it.amount, catId: it.catId, date: it.date, note: it.merchant, created: Date.now(), source: "sms"});
    learnRule(it.type, it.merchant, it.catId);
    S.pending = S.pending.filter(x => x.id !== it.id); save(); render(); toast(`${it.type === "income" ? "Income" : "Expense"} of ${amt(it.amount)} added`); return;
  }
  const sty = e.target.closest("[data-style-set]"); if (sty) { S.settings.style = sty.dataset.styleSet; save(); applyTheme(); render(); return; }
  const th = e.target.closest("[data-theme-set]"); if (th) { S.settings.theme = th.dataset.themeSet; save(); applyTheme(); render(); return; }
  const id = e.target.closest("button")?.id;
  if (id === "newGoal" || id === "editGoal") goalSheet();
  if (id === "goReview") setTab("activity");
  if (id === "skipAll") { if (await confirmBox("Skip all?", `${S.pending.length} bank text${S.pending.length === 1 ? "" : "s"} will be dismissed without logging.`, "Skip all")) { S.pending = []; save(); render(); } }
  if (id === "smsToggle") {
    if (S.settings.sms.enabled) { S.settings.sms.enabled = false; save(); render(); toast("Bank texts won’t be logged"); }
    else if (Android.hasSmsPermission()) window.meridianSmsPermission(true);
    else if (await confirmBox("Read your bank texts?", "Android will ask to let Meridian read SMS. Only messages with an EGP amount are used, and they never leave this phone — the app has no internet access.", "Continue")) Android.requestSmsPermission();
  }
  if (id === "iosImport" || id === "iosImportNow") { if (id === "iosImportNow") closeSheet(); $("#importTexts").click(); }
  if (id === "iosSetup") iosSetupSheet();
  if (id === "smsAuto" && !HAS_SMS) { S.settings.sms.autoAdd = !S.settings.sms.autoAdd; save(); render(); }
  if (id === "smsAuto" && HAS_SMS && S.settings.sms.enabled) { S.settings.sms.autoAdd = !S.settings.sms.autoAdd; save(); render(); }
  if (id === "smsScan" && S.settings.sms.enabled) scanRecentSms(30);
  if (id === "smsRules" && await confirmBox("Forget learned categories?", "Meridian will go back to guessing categories for shops you’ve corrected before.", "Forget")) { S.rules = {}; save(); render(); }
  if (id === "openCalc") calcSheet();
  if (id === "exportJson") exportJson();
  if (id === "exportCsv") exportCsv();
  if (id === "importJson") $("#importFile").click();
  if (id === "eraseAll") {
    if (!await confirmBox("Erase everything?", "All transactions, categories, goals and settings on this phone will be deleted. Back up first if you might want them.", "Erase", true)) return;
    if (!await confirmBox("Are you sure?", "This can’t be undone.", "Yes, erase all", true)) return;
    S = defaultState(); save(); applyTheme(); month = currentKey(); render(); toast("All data erased");
  }
});
/* Android back button: returns true if the app handled it */
window.meridianBack = () => {
  if ($("#dialog").classList.contains("on")) { closeDialog(); return true; }
  if ($("#sheet").classList.contains("on")) { closeSheet(); return true; }
  if (tab !== "home") { setTab("home"); return true; }
  return false;
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (window.Android) { systemDark = readSystemTheme(); applyTheme(); } pullSmsInbox(true); render(); } });

/* iPhone / web: work offline and ask the browser to keep data permanently */
if (!window.Android && location.protocol === "https:") {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

render();
setTimeout(() => pullSmsInbox(true), 400);
</script>
