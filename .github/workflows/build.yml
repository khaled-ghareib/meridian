name: Build Meridian

# Runs every time the project changes (or when you press "Run workflow").
# 1) Builds the Android APK and publishes it on the Releases page.
# 2) Publishes the iPhone / web version to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meridian-build
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Put the app inside the Android project
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www
          rm -f android/app/src/main/assets/www/sw.js

      - name: Unpack the signing key from the private secrets
        env:
          KEYSTORE_B64: ${{ secrets.MERIDIAN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/meridian.keystore
          else
            echo "::warning::No signing key secret found - using a temporary key, so this APK can't update an existing install."
          fi

      - name: Build the APK
        working-directory: android
        env:
          MERIDIAN_KEYSTORE_PASSWORD: ${{ secrets.MERIDIAN_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Meridian.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-APK
          path: Meridian.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Meridian 1.0.${{ github.run_number }}
          body: |
            Download **Meridian.apk** below and open it on your Android phone.
            Installing over an older version keeps all your data.
          files: Meridian.apk
          make_latest: true

  iphone:
    name: iPhone / web version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
